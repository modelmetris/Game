<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scribble Climber</title>
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8ae2ff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #8ae2ff;
    }
    #controls-panel {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      z-index: 100;
      width: 90%;
      max-width: 320px;
    }
    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .slider-row label {
      width: 85px;
      font-weight: bold;
    }
    .slider-row input[type="range"] {
      flex: 1;
      height: 6px;
      accent-color: #ff3344;
    }
    #finish-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 16px 28px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      display: none;
      z-index: 200;
      border: 2px solid gold;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #draw-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      height: 170px;
      background: #ffffff;
      border: 3px solid #111;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      z-index: 20;
    }
    #drawCanvas {
      width: 170px;
      height: 170px;
      display: block;
      border-radius: 17px;
    }
  </style>
</head>
<body>
  <div id="controls-panel">
    <div class="slider-row">
      <label for="speedRange">Speed: <span id="speedVal">0.6</span></label>
      <input type="range" id="speedRange" min="0.2" max="1.5" step="0.1" value="0.6">
    </div>
    <div class="slider-row">
      <label for="spinRange">Motor Spin: <span id="spinVal">0.10</span></label>
      <input type="range" id="spinRange" min="0.04" max="0.25" step="0.01" value="0.10">
    </div>
    <div class="slider-row">
      <label for="gravRange">Gravity: <span id="gravVal">0.35</span></label>
      <input type="range" id="gravRange" min="0.1" max="0.8" step="0.05" value="0.35">
    </div>
  </div>

  <div id="finish-banner">
    <div id="winner-text">YOU WON! 🏆</div>
    <button onclick="resetRace()" style="margin-top:10px; padding:6px 14px; font-weight:bold; border-radius:8px; border:none; background:#ffdd00; cursor:pointer;">Play Again</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="draw-box">
    <canvas id="drawCanvas" width="170" height="170"></canvas>
  </div>

  <script>
    const gCanvas = document.getElementById('gameCanvas');
    const gCtx = gCanvas.getContext('2d');
    const dCanvas = document.getElementById('drawCanvas');
    const dCtx = dCanvas.getContext('2d');

    // UI elements
    const speedSlider = document.getElementById('speedRange');
    const spinSlider = document.getElementById('spinRange');
    const gravSlider = document.getElementById('gravRange');
    const finishBanner = document.getElementById('finish-banner');
    const winnerText = document.getElementById('winner-text');

    let gameSpeed = parseFloat(speedSlider.value);
    let motorSpin = parseFloat(spinSlider.value);
    let gravity = parseFloat(gravSlider.value);

    speedSlider.oninput = (e) => {
      gameSpeed = parseFloat(e.target.value);
      document.getElementById('speedVal').innerText = gameSpeed.toFixed(1);
    };
    spinSlider.oninput = (e) => {
      motorSpin = parseFloat(e.target.value);
      document.getElementById('spinVal').innerText = motorSpin.toFixed(2);
    };
    gravSlider.oninput = (e) => {
      gravity = parseFloat(e.target.value);
      document.getElementById('gravVal').innerText = gravity.toFixed(2);
    };

    function resize() {
      gCanvas.width = window.innerWidth;
      gCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- FINISHED COMPLETE TRACK (No Sudden Drop-off) ---
    const FINISH_LINE_X = 2400;

    const track = [
      { x1: -200, y1: 300, x2: 400,  y2: 300 }, // Start runway
      { x1: 400,  y1: 300, x2: 400,  y2: 220 }, // Step ledge
      { x1: 400,  y1: 220, x2: 900,  y2: 220 }, // Plateau
      { x1: 900,  y1: 220, x2: 1250, y2: 330 }, // Gentle slope down
      { x1: 1250, y1: 330, x2: 1650, y2: 330 }, // Valley floor
      { x1: 1650, y1: 330, x2: 1800, y2: 250 }, // Ramp up
      { x1: 1800, y1: 250, x2: 2600, y2: 250 }, // Straightaway through finish line
      { x1: 2600, y1: 250, x2: 2800, y2: 200 }, // Gentle uphill brake stop
      { x1: 2800, y1: 200, x2: 3200, y2: 200 }  // End pad
    ];

    function getGroundY(x) {
      for (const s of track) {
        const minX = Math.min(s.x1, s.x2);
        const maxX = Math.max(s.x1, s.x2);
        if (x >= minX && x <= maxX) {
          if (s.x1 === s.x2) return Math.min(s.y1, s.y2);
          const t = (x - s.x1) / (s.x2 - s.x1);
          return s.y1 + t * (s.y2 - s.y1);
        }
      }
      return 200;
    }

    // Default round wheel generator
    function getCircle(radius = 32, count = 16) {
      const pts = [];
      for (let i = 0; i <= count; i++) {
        const a = (i / count) * Math.PI * 2;
        pts.push({ x: Math.cos(a) * radius, y: Math.sin(a) * radius });
      }
      return pts;
    }

    function getClimber() {
      return [
        { x: -10, y: -45 },
        { x: 35, y: 35 },
        { x: -40, y: 20 },
        { x: -10, y: -45 }
      ];
    }

    function renderPadPreview(pts) {
      dCtx.clearRect(0, 0, 170, 170);
      dCtx.lineWidth = 6;
      dCtx.lineCap = 'round';
      dCtx.strokeStyle = '#111';
      dCtx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const px = 85 + pts[i].x;
        const py = 85 + pts[i].y;
        if (i === 0) dCtx.moveTo(px, py);
        else dCtx.lineTo(px, py);
      }
      dCtx.stroke();
    }

    let raceFinished = false;

    const player = {
      x: 60,
      y: 200,
      vx: 0,
      vy: 0,
      angle: 0,
      points: getCircle(),
      color: '#e63946'
    };

    const bot = {
      x: 0,
      y: 200,
      vx: 0,
      vy: 0,
      angle: 0,
      points: getCircle(),
      color: '#1d3557',
      adapted: false
    };

    renderPadPreview(player.points);

    function resetRace() {
      player.x = 60;
      player.y = 200;
      player.vx = 0;
      player.vy = 0;
      player.angle = 0;
      player.points = getCircle();

      bot.x = 0;
      bot.y = 200;
      bot.vx = 0;
      bot.vy = 0;
      bot.angle = 0;
      bot.points = getCircle();
      bot.adapted = false;

      raceFinished = false;
      finishBanner.style.display = 'none';
      renderPadPreview(player.points);
    }

    // --- TUNED STEADY PHYSICS ---
    function updateRacer(r, isAI = false) {
      r.angle += motorSpin * gameSpeed;
      let contacts = 0;
      let lift = 0;
      let pushForward = 0;

      for (const pt of r.points) {
        const cos = Math.cos(r.angle);
        const sin = Math.sin(r.angle);
        const px = r.x + (pt.x * cos - pt.y * sin);
        const py = r.y + (pt.x * sin + pt.y * cos);

        const groundY = getGroundY(px);
        if (py > groundY) {
          contacts++;
          const depth = py - groundY;
          lift += depth * 0.25;
          pushForward += 0.55 * gameSpeed;
        }

        // Ledge climbing boost
        if (px >= 395 && px <= 405 && py < 300 && py > 220) {
          lift += 2.0;
          pushForward += 1.0 * gameSpeed;
        }
      }

      if (contacts > 0) {
        r.vy -= lift;
        r.vx += pushForward;
        // Directional lock: cannot slip backward
        if (r.vx < 1.0 * gameSpeed) r.vx = 1.0 * gameSpeed;
      }

      // Smooth gravity & air friction
      r.vy += gravity * gameSpeed;
      r.vx *= 0.92;
      r.vy *= 0.92;

      r.x += r.vx;
      r.y += r.vy;

      // Chassis ground plane collision
      const groundAtCenter = getGroundY(r.x);
      if (r.y > groundAtCenter - 14) {
        r.y = groundAtCenter - 14;
        if (r.vy > 0) r.vy = 0;
      }

      // Finish line check
      if (!raceFinished && r.x >= FINISH_LINE_X) {
        raceFinished = true;
        finishBanner.style.display = 'block';
        winnerText.innerText = isAI ? 'BOT WON! 🤖' : 'YOU WON! 🏆';
      }

      // AI reacts near obstacle
      if (isAI && !r.adapted && r.x > 340) {
        r.points = getClimber();
        r.adapted = true;
      }
    }

    // --- DRAWING PAD LOGIC ---
    let drawing = false;
    let stroke = [];

    function getTouchPos(e) {
      const r = dCanvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * (170 / r.width),
        y: (t.clientY - r.top) * (170 / r.height)
      };
    }

    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      stroke = [];
      dCtx.clearRect(0, 0, 170, 170);
      drawMove(e);
    }

    function drawMove(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = getTouchPos(e);
      stroke.push(p);

      dCtx.lineWidth = 6;
      dCtx.lineCap = 'round';
      dCtx.strokeStyle = '#111';
      if (stroke.length > 1) {
        dCtx.beginPath();
        dCtx.moveTo(stroke[stroke.length - 2].x, stroke[stroke.length - 2].y);
        dCtx.lineTo(p.x, p.y);
        dCtx.stroke();
      }
    }

    function endDraw(e) {
      if (!drawing) return;
      drawing = false;
      if (stroke.length < 3) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of stroke) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }

      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const scale = Math.max(maxX - minX, maxY - minY, 30) / 70;

      const pts = [];
      const step = Math.max(1, Math.floor(stroke.length / 16));
      for (let i = 0; i < stroke.length; i += step) {
        pts.push({
          x: (stroke[i].x - cx) / scale,
          y: (stroke[i].y - cy) / scale
        });
      }
      pts.push({ x: pts[0].x, y: pts[0].y });
      player.points = pts;
    }

    dCanvas.addEventListener('pointerdown', startDraw);
    dCanvas.addEventListener('pointermove', drawMove);
    dCanvas.addEventListener('pointerup', endDraw);
    dCanvas.addEventListener('pointercancel', endDraw);

    // --- RENDER RACERS ---
    function renderRacer(r) {
      gCtx.save();
      gCtx.translate(r.x, r.y);

      // Limbs / wheels
      gCtx.save();
      gCtx.rotate(r.angle);
      gCtx.strokeStyle = '#111';
      gCtx.lineWidth = 6;
      gCtx.lineCap = 'round';
      gCtx.lineJoin = 'round';
      if (r.points.length > 1) {
        gCtx.beginPath();
        gCtx.moveTo(r.points[0].x, r.points[0].y);
        for (let i = 1; i < r.points.length; i++) {
          gCtx.lineTo(r.points[i].x, r.points[i].y);
        }
        gCtx.stroke();
      }
      gCtx.restore();

      // Chassis body
      gCtx.fillStyle = r.color;
      gCtx.fillRect(-20, -16, 40, 22);

      // Rider
      gCtx.fillStyle = '#fff';
      gCtx.beginPath();
      gCtx.arc(0, -20, 9, 0, Math.PI * 2);
      gCtx.fill();
      gCtx.fillStyle = '#111';
      gCtx.beginPath();
      gCtx.arc(3, -20, 2.5, 0, Math.PI * 2);
      gCtx.fill();

      gCtx.restore();
    }

    // --- GAME LOOP ---
    function loop() {
      updateRacer(player);
      updateRacer(bot, true);

      // Camera smoothly follows player
      const camX = player.x - gCanvas.width * 0.35;
      const camY = player.y - gCanvas.height * 0.55;

      // Sky background
      gCtx.fillStyle = '#8ae2ff';
      gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);

      gCtx.save();
      gCtx.translate(-camX, -camY);

      // Track surface
      gCtx.strokeStyle = '#444';
      gCtx.lineWidth = 14;
      gCtx.lineCap = 'round';
      gCtx.lineJoin = 'round';
      gCtx.beginPath();
      gCtx.moveTo(track[0].x1, track[0].y1);
      for (const s of track) {
        gCtx.lineTo(s.x2, s.y2);
      }
      gCtx.stroke();

      // Terrain underfill
      gCtx.lineTo(3400, 900);
      gCtx.lineTo(-300, 900);
      gCtx.closePath();
      gCtx.fillStyle = '#8b5a2b';
      gCtx.fill();

      // Finish Line Marker
      const finishGroundY = getGroundY(FINISH_LINE_X);
      gCtx.strokeStyle = '#fff';
      gCtx.lineWidth = 6;
      gCtx.setLineDash([12, 12]);
      gCtx.beginPath();
      gCtx.moveTo(FINISH_LINE_X, finishGroundY);
      gCtx.lineTo(FINISH_LINE_X, finishGroundY - 140);
      gCtx.stroke();
      gCtx.setLineDash([]);

      // Finish Flag
      gCtx.fillStyle = '#ff3344';
      gCtx.beginPath();
      gCtx.moveTo(FINISH_LINE_X, finishGroundY - 140);
      gCtx.lineTo(FINISH_LINE_X + 35, finishGroundY - 120);
      gCtx.lineTo(FINISH_LINE_X, finishGroundY - 100);
      gCtx.fill();

      // Render Racers
      renderRacer(bot);
      renderRacer(player);

      gCtx.restore();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
