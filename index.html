<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scribble Racer</title>
  <style>
    * { box-sizing: border-box; touch-action: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #7ec0ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-container {
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
    }
    .badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    #draw-box {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #222;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      touch-action: none;
    }
    #drawCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 17px;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui-container">
    <div class="badge" id="statusBadge">Draw a shape below to run!</div>
  </div>

  <div id="draw-box">
    <canvas id="drawCanvas" width="180" height="180"></canvas>
  </div>

  <script>
    // --- 1. DISPLAY & VIEWPORT SETUP ---
    const gCanvas = document.getElementById('gameCanvas');
    const gCtx = gCanvas.getContext('2d');
    const dCanvas = document.getElementById('drawCanvas');
    const dCtx = dCanvas.getContext('2d');

    function resize() {
      gCanvas.width = window.innerWidth * window.devicePixelRatio;
      gCanvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 2. TRACK GEOMETRY ---
    // Track segments with varying elevation and obstacles
    const track = [
      { x1: -50,  y1: 300, x2: 400,  y2: 300 }, // Start flat
      { x1: 400,  y1: 300, x2: 400,  y2: 240 }, // Step ledge up
      { x1: 400,  y1: 240, x2: 900,  y2: 240 }, // High ground
      { x1: 900,  y1: 240, x2: 1200, y2: 350 }, // Down ramp
      { x1: 1200, y1: 350, x2: 1500, y2: 350 }, // Water / basin bed
      { x1: 1500, y1: 350, x2: 1600, y2: 260 }, // Steep ramp up
      { x1: 1600, y1: 260, x2: 2600, y2: 260 }  // Final sprint
    ];

    function getGroundY(x) {
      for (const seg of track) {
        const minX = Math.min(seg.x1, seg.x2);
        const maxX = Math.max(seg.x1, seg.x2);
        if (x >= minX && x <= maxX) {
          if (seg.x1 === seg.x2) return Math.min(seg.y1, seg.y2);
          const t = (x - seg.x1) / (seg.x2 - seg.x1);
          return seg.y1 + t * (seg.y2 - seg.y1);
        }
      }
      return 600;
    }

    // --- 3. RACER SIMULATION ---
    function makeDefaultPoints() {
      const pts = [];
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        pts.push({ x: Math.cos(a) * 32, y: Math.sin(a) * 32 });
      }
      return pts;
    }

    function makeClimberPoints() {
      return [
        { x: 0, y: -45 },
        { x: 25, y: 35 },
        { x: -35, y: 15 },
        { x: 0, y: -45 }
      ];
    }

    const player = {
      x: 60,
      y: 200,
      vx: 0,
      vy: 0,
      angle: 0,
      points: makeDefaultPoints(),
      color: '#e63946'
    };

    const bot = {
      x: 20,
      y: 200,
      vx: 0,
      vy: 0,
      angle: 0,
      points: makeDefaultPoints(),
      color: '#457b9d',
      adapted: false
    };

    function updateRacer(r, isAI = false) {
      // Motor angular rotation
      r.angle += 0.22;

      // Check limb tips against the terrain
      let onGround = false;
      let pushX = 0;
      let pushY = 0;

      for (const pt of r.points) {
        // Rotate point
        const cos = Math.cos(r.angle);
        const sin = Math.sin(r.angle);
        const px = r.x + (pt.x * cos - pt.y * sin);
        const py = r.y + (pt.x * sin + pt.y * cos);

        const groundY = getGroundY(px);
        if (py > groundY) {
          onGround = true;
          const penetration = py - groundY;
          pushY -= penetration * 0.4;
          // Forward traction propulsion
          pushX += 0.95;
        }
      }

      // Physics integration
      r.vx += pushX;
      r.vy += pushY + 0.65; // Gravity
      r.vx *= 0.88;         // Drag
      r.vy *= 0.88;

      r.x += r.vx;
      r.y += r.vy;

      // Keep chassis above track line
      const baseline = getGroundY(r.x) - 15;
      if (r.y > baseline) {
        r.y = baseline;
        r.vy = 0;
      }

      // AI auto-switch near the step obstacle
      if (isAI && !r.adapted && r.x > 330) {
        r.points = makeClimberPoints();
        r.adapted = true;
      }
    }

    // --- 4. DRAWING CANVAS LOGIC ---
    let isDrawing = false;
    let stroke = [];

    function getCoords(e) {
      const rect = dCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (dCanvas.width / rect.width),
        y: (cy - rect.top) * (dCanvas.height / rect.height)
      };
    }

    function onPointerDown(e) {
      e.preventDefault();
      isDrawing = true;
      stroke = [];
      dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);
      onPointerMove(e);
    }

    function onPointerMove(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const p = getCoords(e);
      stroke.push(p);

      dCtx.lineWidth = 8;
      dCtx.lineCap = 'round';
      dCtx.strokeStyle = '#1d3557';
      if (stroke.length > 1) {
        dCtx.beginPath();
        dCtx.moveTo(stroke[stroke.length - 2].x, stroke[stroke.length - 2].y);
        dCtx.lineTo(p.x, p.y);
        dCtx.stroke();
      }
    }

    function onPointerUp(e) {
      if (!isDrawing) return;
      isDrawing = false;
      if (stroke.length < 3) return;

      // Center and normalize drawn coordinates
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of stroke) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }

      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const scale = Math.max(maxX - minX, maxY - minY, 30) / 70;

      const pts = [];
      const step = Math.max(1, Math.floor(stroke.length / 16));
      for (let i = 0; i < stroke.length; i += step) {
        pts.push({
          x: (stroke[i].x - cx) / scale,
          y: (stroke[i].y - cy) / scale
        });
      }
      pts.push({ x: pts[0].x, y: pts[0].y });
      player.points = pts;
    }

    // Touch and mouse event binds
    dCanvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    dCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // --- 5. RENDER LOOP ---
    function renderRacer(r) {
      gCtx.save();
      gCtx.translate(r.x, r.y);

      // Limbs / wheels
      gCtx.save();
      gCtx.rotate(r.angle);
      gCtx.strokeStyle = '#111';
      gCtx.lineWidth = 7;
      gCtx.lineCap = 'round';
      gCtx.lineJoin = 'round';

      if (r.points.length > 1) {
        gCtx.beginPath();
        gCtx.moveTo(r.points[0].x, r.points[0].y);
        for (let i = 1; i < r.points.length; i++) {
          gCtx.lineTo(r.points[i].x, r.points[i].y);
        }
        gCtx.stroke();
      }
      gCtx.restore();

      // Vehicle Chassis Body
      gCtx.fillStyle = r.color;
      gCtx.fillRect(-22, -18, 44, 24);

      // Rider head
      gCtx.fillStyle = '#fff';
      gCtx.beginPath();
      gCtx.arc(0, -22, 10, 0, Math.PI * 2);
      gCtx.fill();
      gCtx.fillStyle = '#111';
      gCtx.beginPath();
      gCtx.arc(4, -22, 3, 0, Math.PI * 2);
      gCtx.fill();

      gCtx.restore();
    }

    function loop() {
      updateRacer(player);
      updateRacer(bot, true);

      // Dynamic Camera follow
      const dpr = window.devicePixelRatio || 1;
      const viewW = gCanvas.width / dpr;
      const viewH = gCanvas.height / dpr;
      const camX = player.x - viewW * 0.35;
      const camY = player.y - viewH * 0.55;

      gCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Sky background
      gCtx.fillStyle = '#a8e6cf';
      gCtx.fillRect(0, 0, viewW, viewH);

      gCtx.save();
      gCtx.translate(-camX, -camY);

      // Draw Terrain / Path
      gCtx.strokeStyle = '#555';
      gCtx.lineWidth = 14;
      gCtx.lineCap = 'round';
      gCtx.lineJoin = 'round';
      gCtx.beginPath();
      gCtx.moveTo(track[0].x1, track[0].y1);
      for (const seg of track) {
        gCtx.lineTo(seg.x2, seg.y2);
      }
      gCtx.stroke();

      // Terrain fill underneath
      gCtx.lineTo(3000, 800);
      gCtx.lineTo(-100, 800);
      gCtx.closePath();
      gCtx.fillStyle = '#8b5a2b';
      gCtx.fill();

      // Render Racers
      renderRacer(bot);
      renderRacer(player);

      gCtx.restore();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
