<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scribble Climber</title>
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8ae2ff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #8ae2ff;
    }
    #status-pill {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
      z-index: 10;
    }
    #draw-box {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      background: #ffffff;
      border: 3px solid #111;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 20;
    }
    #drawCanvas {
      width: 180px;
      height: 180px;
      display: block;
      border-radius: 17px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="status-pill">Draw a shape to drive & climb!</div>

  <div id="draw-box">
    <canvas id="drawCanvas" width="180" height="180"></canvas>
  </div>

  <script>
    const gCanvas = document.getElementById('gameCanvas');
    const gCtx = gCanvas.getContext('2d');
    const dCanvas = document.getElementById('drawCanvas');
    const dCtx = dCanvas.getContext('2d');

    function resize() {
      gCanvas.width = window.innerWidth;
      gCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- TRACK SEGMENTS ---
    const track = [
      { x1: -200, y1: 300, x2: 450,  y2: 300 }, // Start flat
      { x1: 450,  y1: 300, x2: 450,  y2: 210 }, // Vertical step/wall
      { x1: 450,  y1: 210, x2: 950,  y2: 210 }, // Top plateau
      { x1: 950,  y1: 210, x2: 1300, y2: 340 }, // Slope down
      { x1: 1300, y1: 340, x2: 1700, y2: 340 }, // Flat basin
      { x1: 1700, y1: 340, x2: 1850, y2: 220 }, // Steep ramp up
      { x1: 1850, y1: 220, x2: 4000, y2: 220 }  // Final run
    ];

    function getGroundY(x) {
      for (const s of track) {
        const minX = Math.min(s.x1, s.x2);
        const maxX = Math.max(s.x1, s.x2);
        if (x >= minX && x <= maxX) {
          if (s.x1 === s.x2) return Math.min(s.y1, s.y2);
          const t = (x - s.x1) / (s.x2 - s.x1);
          return s.y1 + t * (s.y2 - s.y1);
        }
      }
      return 600;
    }

    // Default round wheel generator
    function getCircle(radius = 34, count = 16) {
      const pts = [];
      for (let i = 0; i <= count; i++) {
        const a = (i / count) * Math.PI * 2;
        pts.push({ x: Math.cos(a) * radius, y: Math.sin(a) * radius });
      }
      return pts;
    }

    function getClimber() {
      return [
        { x: -10, y: -45 },
        { x: 35, y: 35 },
        { x: -40, y: 20 },
        { x: -10, y: -45 }
      ];
    }

    function renderPadPreview(pts) {
      dCtx.clearRect(0, 0, 180, 180);
      dCtx.lineWidth = 6;
      dCtx.lineCap = 'round';
      dCtx.strokeStyle = '#111';
      dCtx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const px = 90 + pts[i].x;
        const py = 90 + pts[i].y;
        if (i === 0) dCtx.moveTo(px, py);
        else dCtx.lineTo(px, py);
      }
      dCtx.stroke();
    }

    const player = {
      x: 60,
      y: 200,
      vx: 0,
      vy: 0,
      angle: 0,
      points: getCircle(),
      color: '#e63946'
    };

    const bot = {
      x: 10,
      y: 200,
      vx: 0,
      vy: 0,
      angle: 0,
      points: getCircle(),
      color: '#1d3557',
      adapted: false
    };

    renderPadPreview(player.points);

    // --- ENHANCED PHYSICS ENGINE ---
    function updateRacer(r, isAI = false) {
      r.angle += 0.22;
      let contacts = 0;
      let lift = 0;
      let forwardDrive = 0;

      for (const pt of r.points) {
        const cos = Math.cos(r.angle);
        const sin = Math.sin(r.angle);
        const px = r.x + (pt.x * cos - pt.y * sin);
        const py = r.y + (pt.x * sin + pt.y * cos);

        const groundY = getGroundY(px);
        if (py > groundY) {
          contacts++;
          const depth = py - groundY;
          lift += depth * 0.35;
          forwardDrive += 1.1; // Forward propulsion per contact point
        }

        // Ledge-catching hook check (vertical wall traversal)
        if (px >= 445 && px <= 455 && py < 300 && py > 210) {
          lift += 3.5;
          forwardDrive += 2.0;
        }
      }

      if (contacts > 0) {
        r.vy -= lift;
        r.vx += forwardDrive;
        // Enforce strong forward traction; prevent sliding backwards down slopes
        if (r.vx < 2.0) r.vx = 2.0;
      }

      // Gravity and air drag
      r.vy += 0.65;
      r.vx *= 0.90;
      r.vy *= 0.90;

      r.x += r.vx;
      r.y += r.vy;

      // Keep chassis hovering safely on wheel hubs
      const groundAtCenter = getGroundY(r.x);
      if (r.y > groundAtCenter - 14) {
        r.y = groundAtCenter - 14;
        if (r.vy > 0) r.vy = 0;
      }

      // AI auto-morph near obstacle
      if (isAI && !r.adapted && r.x > 380) {
        r.points = getClimber();
        r.adapted = true;
      }
    }

    // --- DRAWING INTERACTION ---
    let drawing = false;
    let stroke = [];

    function getTouchPos(e) {
      const r = dCanvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * (180 / r.width),
        y: (t.clientY - r.top) * (180 / r.height)
      };
    }

    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      stroke = [];
      dCtx.clearRect(0, 0, 180, 180);
      drawMove(e);
    }

    function drawMove(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = getTouchPos(e);
      stroke.push(p);

      dCtx.lineWidth = 7;
      dCtx.lineCap = 'round';
      dCtx.strokeStyle = '#111';
      if (stroke.length > 1) {
        dCtx.beginPath();
        dCtx.moveTo(stroke[stroke.length - 2].x, stroke[stroke.length - 2].y);
        dCtx.lineTo(p.x, p.y);
        dCtx.stroke();
      }
    }

    function endDraw(e) {
      if (!drawing) return;
      drawing = false;
      if (stroke.length < 3) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of stroke) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }

      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const scale = Math.max(maxX - minX, maxY - minY, 30) / 75;

      const pts = [];
      const step = Math.max(1, Math.floor(stroke.length / 16));
      for (let i = 0; i < stroke.length; i += step) {
        pts.push({
          x: (stroke[i].x - cx) / scale,
          y: (stroke[i].y - cy) / scale
        });
      }
      pts.push({ x: pts[0].x, y: pts[0].y });
      player.points = pts;
    }

    dCanvas.addEventListener('pointerdown', startDraw);
    dCanvas.addEventListener('pointermove', drawMove);
    dCanvas.addEventListener('pointerup', endDraw);
    dCanvas.addEventListener('pointercancel', endDraw);

    // --- RENDER RACERS ---
    function renderRacer(r) {
      gCtx.save();
      gCtx.translate(r.x, r.y);

      // Rotating limbs
      gCtx.save();
      gCtx.rotate(r.angle);
      gCtx.strokeStyle = '#111';
      gCtx.lineWidth = 7;
      gCtx.lineCap = 'round';
      gCtx.lineJoin = 'round';
      if (r.points.length > 1) {
        gCtx.beginPath();
        gCtx.moveTo(r.points[0].x, r.points[0].y);
        for (let i = 1; i < r.points.length; i++) {
          gCtx.lineTo(r.points[i].x, r.points[i].y);
        }
        gCtx.stroke();
      }
      gCtx.restore();

      // Chassis body
      gCtx.fillStyle = r.color;
      gCtx.fillRect(-22, -18, 44, 24);

      // Rider
      gCtx.fillStyle = '#fff';
      gCtx.beginPath();
      gCtx.arc(0, -22, 10, 0, Math.PI * 2);
      gCtx.fill();
      gCtx.fillStyle = '#111';
      gCtx.beginPath();
      gCtx.arc(4, -22, 3, 0, Math.PI * 2);
      gCtx.fill();

      gCtx.restore();
    }

    // --- GAME LOOP ---
    function loop() {
      updateRacer(player);
      updateRacer(bot, true);

      // Camera smoothly tracks player
      const camX = player.x - gCanvas.width * 0.35;
      const camY = player.y - gCanvas.height * 0.55;

      // Sky
      gCtx.fillStyle = '#8ae2ff';
      gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);

      gCtx.save();
      gCtx.translate(-camX, -camY);

      // Track surface
      gCtx.strokeStyle = '#444';
      gCtx.lineWidth = 14;
      gCtx.lineCap = 'round';
      gCtx.lineJoin = 'round';
      gCtx.beginPath();
      gCtx.moveTo(track[0].x1, track[0].y1);
      for (const s of track) {
        gCtx.lineTo(s.x2, s.y2);
      }
      gCtx.stroke();

      // Dirt fill
      gCtx.lineTo(4200, 900);
      gCtx.lineTo(-300, 900);
      gCtx.closePath();
      gCtx.fillStyle = '#8b5a2b';
      gCtx.fill();

      // Draw competitors
      renderRacer(bot);
      renderRacer(player);

      gCtx.restore();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
